[mod]
id = "elytratrails"
version = "0.1.2"

[compatibility]
horizon_revision = "02c8607ee8ebd216f2f535c1eb7b62b572830df2"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "official_elytratrails"
source = "core.rs"

[[module]]
id = "trail"
file = "crates/horizon-client/src/game.rs"
name = "official_elytratrails_trail"
source = "trail.rs"

[[module]]
id = "net"
file = "crates/horizon-client/src/game.rs"
name = "official_elytratrails_net"
source = "net.rs"

[[module]]
id = "page"
file = "crates/horizon-client/src/game.rs"
name = "official_elytratrails_page"
source = "page.rs"

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "lines"
target = "horizon_client::game::native_visuals::Game<'_>::native_frame_visuals"
kind = "HEAD"
helper = "lines.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "lines", ty = "&mut Vec<horizon_client::gizmos::Line>", value = "&mut *lines" },
]

[[injection]]
id = "net_from_client"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "net_from_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net_from_server"
hook = "net_from_server"
hook_version = 1
kind = "HEAD"
helper = "net_from_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "server_tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
